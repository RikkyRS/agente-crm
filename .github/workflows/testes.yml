# Roda os testes do agente a cada push e pull request.
# Não precisa de Ollama nem do CRM: os testes usam modelo e CRM falsos (mocks).
name: testes
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
